openapi: 3.1.0
info:
  title: Logistic Platform API
  version: 1.0.0
  description: Distributed Logistics & Dispatch Platform REST API
servers:
  - url: /api
    description: Nginx routed API path
paths:
  /auth/register:
    post:
      summary: Register a new Customer or Courier
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failure or invalid payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Email or phone already registered
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/login:
    post:
      summary: Authenticate user with credentials
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid email, password, or account suspended
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/refresh:
    post:
      summary: Rotate and refresh access token using a refresh token
      operationId: refreshToken
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed and rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      summary: Revoke refresh token and logout
      operationId: logoutUser
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logged out and refresh token revoked

  /auth/me:
    get:
      summary: Get authenticated user profile and roles
      operationId: getCurrentUser
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized

  /auth/ws-ticket:
    post:
      summary: Issue short-lived ticket for WebSocket gateway connection
      operationId: getWebSocketTicket
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Short-lived WebSocket ticket issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketTicketResponse'
        '401':
          description: Unauthorized

  /auth/jwks:
    get:
      summary: JSON Web Key Set (JWKS) for asymmetric key token validation
      operationId: getJwks
      tags:
        - Authentication
      responses:
        '200':
          description: RFC 7517 JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonWebKeySet'

  /admin/couriers/{id}/approve:
    post:
      summary: Admin approval for pending courier registration
      operationId: approveCourier
      tags:
        - Admin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Courier approved and transitioned to Offline status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
        '404':
          description: Courier not found
        '409':
          description: Courier is not in PendingApproval status

  /admin/couriers/pending:
    get:
      summary: List couriers awaiting admin approval
      operationId: getPendingCouriers
      tags:
        - Admin
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pending couriers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourierDetailResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)

  /orders:
    post:
      summary: Create a new delivery order with stops
      operationId: createOrder
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key to prevent double creation
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          headers:
            Location:
              schema:
                type: string
              description: URL of created order resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
        '409':
          description: Idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    get:
      summary: List orders with pagination and filtering
      operationId: getOrders
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated orders list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOrdersResponse'
        '401':
          description: Unauthorized

  /orders/{id}:
    get:
      summary: Get order details by ID
      operationId: getOrderById
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
        '404':
          description: Order not found

  /orders/{id}/cancel:
    post:
      summary: Cancel an order before pickup
      operationId: cancelOrder
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '409':
          description: Order cannot be cancelled in its current state

  /orders/{id}/pickup:
    post:
      summary: Courier marks order picked up
      operationId: pickupOrder
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order transitioned to PickedUp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Only assigned courier can pickup)
        '404':
          description: Order not found
        '409':
          description: Illegal status transition

  /orders/{id}/deliver:
    post:
      summary: Courier marks order delivered
      operationId: deliverOrder
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order transitioned to Delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Only assigned courier can deliver)
        '404':
          description: Order not found
        '409':
          description: Illegal status transition

  /couriers:
    get:
      summary: List couriers with pagination and status filter
      operationId: getCouriers
      tags:
        - Couriers
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated couriers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCouriersResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Dispatcher or Admin required)

  /couriers/{id}:
    get:
      summary: Get courier profile by ID
      operationId: getCourierById
      tags:
        - Couriers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Courier profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierDetailResponse'
        '401':
          description: Unauthorized
        '404':
          description: Courier not found

  /couriers/me:
    get:
      summary: Get authenticated courier profile and active assignment
      operationId: getMyCourierProfile
      tags:
        - Couriers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated courier profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierDetailResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Courier role required)

  /couriers/{id}/status:
    put:
      summary: Update courier availability status (Available, Offline, Busy)
      operationId: updateCourierStatus
      tags:
        - Couriers
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourierStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierDetailResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Courier not found
        '409':
          description: Cannot transition to offline with active order

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
        - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
        role:
          type: string
          enum: [Customer, Courier]
        vehicleType:
          type: string
          description: Required if role is Courier (e.g., Car, Bicycle, Motorcycle, Van)
        plateNumber:
          type: string
          description: Required if role is Courier and vehicle is motorized
        makeModel:
          type: string
        color:
          type: string
        year:
          type: integer

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Token validity in seconds
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required:
        - id
        - email
        - fullName
        - status
        - roles
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    CourierResponse:
      type: object
      required:
        - id
        - status
        - rating
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        rating:
          type: number
        vehicleId:
          type: string
          format: uuid
          nullable: true
        vehicleType:
          type: string
          nullable: true
        plateNumber:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    WebSocketTicketResponse:
      type: object
      required:
        - ticket
        - expiresIn
        - expiresAt
      properties:
        ticket:
          type: string
        expiresIn:
          type: integer
        expiresAt:
          type: string
          format: date-time

    JsonWebKeySet:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string

    CreateOrderStopRequest:
      type: object
      required:
        - sequence
        - type
        - address
        - latitude
        - longitude
      properties:
        sequence:
          type: integer
          example: 1
        type:
          type: string
          enum: [Pickup, Dropoff]
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        contactName:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true

    CreateOrderRequest:
      type: object
      required:
        - stops
      properties:
        priority:
          type: integer
          default: 0
        vehicleType:
          type: string
          enum: [Bike, Car, Van, Truck]
          nullable: true
        packageDescription:
          type: string
          nullable: true
        packageWeight:
          type: number
          nullable: true
        requestedPickupAt:
          type: string
          format: date-time
          nullable: true
        stops:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/CreateOrderStopRequest'

    OrderStopResponse:
      type: object
      required:
        - id
        - sequence
        - type
        - address
        - latitude
        - longitude
      properties:
        id:
          type: string
          format: uuid
        sequence:
          type: integer
        type:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        contactName:
          type: string
          nullable: true
        contactPhone:
          type: string
          nullable: true
        arrivedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    OrderStatusHistoryResponse:
      type: object
      required:
        - id
        - toStatus
        - actorType
        - occurredAt
      properties:
        id:
          type: integer
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
        reason:
          type: string
          nullable: true
        actorType:
          type: string
        actorId:
          type: string
          format: uuid
          nullable: true
        occurredAt:
          type: string
          format: date-time

    AssignmentResponse:
      type: object
      required:
        - id
        - courierId
        - status
        - assignedAt
      properties:
        id:
          type: string
          format: uuid
        courierId:
          type: string
          format: uuid
        status:
          type: string
        assignedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    OrderResponse:
      type: object
      required:
        - id
        - orderNo
        - customerId
        - status
        - priority
        - version
        - createdAt
        - updatedAt
        - stops
      properties:
        id:
          type: string
          format: uuid
        orderNo:
          type: string
        customerId:
          type: string
          format: uuid
        status:
          type: string
        priority:
          type: integer
        vehicleType:
          type: string
          nullable: true
        packageDescription:
          type: string
          nullable: true
        packageWeight:
          type: number
          nullable: true
        requestedPickupAt:
          type: string
          format: date-time
          nullable: true
        assignedCourierId:
          type: string
          format: uuid
          nullable: true
        cancelledReason:
          type: string
          nullable: true
        cancelledBy:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        stops:
          type: array
          items:
            $ref: '#/components/schemas/OrderStopResponse'
        statusHistories:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusHistoryResponse'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentResponse'

    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true

    PagedOrdersResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - totalCount
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer

    UpdateCourierStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [Available, Offline, Busy]

    CourierDetailResponse:
      type: object
      required:
        - id
        - userId
        - fullName
        - email
        - status
        - rating
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        status:
          type: string
        rating:
          type: number
        vehicleId:
          type: string
          format: uuid
          nullable: true
        vehicleType:
          type: string
          nullable: true
        plateNo:
          type: string
          nullable: true
        currentActiveOrderId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true

    PagedCouriersResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - totalCount
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourierDetailResponse'
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer


